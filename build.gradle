plugins {
	id 'org.springframework.boot' version '2.3.4.RELEASE'
	id 'io.spring.dependency-management' version '1.0.10.RELEASE'
	id 'java'
}

group = 'com.softlines'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.modelmapper:modelmapper:1.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation group: 'com.auth0', name: 'java-jwt', version: '3.11.0'


//	compile group: 'org.mapstruct', name: 'mapstruct', version: '1.4.1.Final'
//	compile group: 'org.mapstruct', name: 'mapstruct-processor', version: '1.4.1.Final'

	implementation group: 'org.mapstruct', name: 'mapstruct', version: '1.3.0.Final'
	implementation 'junit:junit:4.12'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.3.0.Final'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'mysql:mysql-connector-java'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testCompile group: 'org.springframework', name: 'spring-test', version: '5.2.9.RELEASE'
	testCompile group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: '2.3.4.RELEASE'

}

test {
	useJUnitPlatform()
}

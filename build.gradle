
plugins {
	id 'org.springframework.boot' version '2.3.4.RELEASE'
	id 'io.spring.dependency-management' version '1.0.10.RELEASE'
	id 'java'
//	id 'com.ewerk.gradle.plugins.querydsl' version "1.0.10"

}


group = 'com.softlines'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'


repositories {
	mavenCentral()
}

dependencies {

//	implementation group: 'com.querydsl', name: 'querydsl-apt', version: '4.2.1'
	implementation group: 'com.querydsl', name: 'querydsl-jpa', version: '4.2.1'

	implementation group: 'org.javatuples', name: 'javatuples', version: '1.2'

	implementation group: 'com.googlecode.libphonenumber', name: 'libphonenumber', version: '8.12.13'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.3.0.Final'
	implementation group: 'org.mapstruct', name: 'mapstruct', version: '1.3.0.Final'
	implementation 'org.modelmapper:modelmapper:1.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation group: 'com.auth0', name: 'java-jwt', version: '3.11.0'
	implementation 'junit:junit:4.12'
	implementation 'org.jetbrains:annotations:19.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'



	implementation group: 'io.springfox', name: 'springfox-boot-starter', version: '3.0.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'


	runtimeOnly 'mysql:mysql-connector-java'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation group: 'org.springframework', name: 'spring-test', version: '5.2.9.RELEASE'
	testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: '2.3.4.RELEASE'
	testImplementation group: 'com.h2database', name: 'h2', version: '1.4.198'
	implementation group: 'javax.validation', name: 'validation-api', version: '2.0.0.Final'
	implementation group: 'org.hibernate.validator', name: 'hibernate-validator', version: '6.0.20.Final'
	implementation group: 'org.hibernate', name: 'hibernate-validator-annotation-processor', version: '6.0.20.Final'
	testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.17.1'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation', version: '2.3.1.RELEASE'
	implementation "org.springframework.boot:spring-boot-starter-actuator"

}

test {
	useJUnitPlatform()
}

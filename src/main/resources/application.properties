
spring.datasource.url = jdbc:mysql://localhost:3306/db?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password =

com.softlines.fastpos.jwtsecurity.url = jdbc:mysql://localhost:3306/securitydb?createDatabaseIfNotExist=true
com.softlines.fastpos.jwtsecurity.username = root
com.softlines.fastpos.jwtsecurity.password =

hibernate.hbm2ddl.auto=update
hibernate.show-sql=true
spring.jpa.database-platform = org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

spring.main.allow-bean-definition-overriding=true
#logging.level.org.hibernate.type=TRACE

spring.messages.basename=messages
spring.profiles.active=prod